<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Расходы поездки</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input[type="number"],
input[type="date"],
input[type="text"],
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 15px;
}

.pay-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.pay-buttons label {
    margin: 0;
    font-weight: normal;
}

.pay-buttons input {
    display: none;
}

.pay-button {
    display: block;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    background: #fafafa;
    font-size: 14px;
}

.pay-buttons input:checked + .pay-button {
    background: #222;
    color: white;
    border-color: #222;
}

.people {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
}

.person {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    background: #fafafa;
    margin: 0;
    font-weight: normal;
}

.person input {
    width: 18px;
    height: 18px;
    margin: 0;
}

button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 13px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
}

.summary {
    font-size: 16px;
    line-height: 1.6;
}

.currency-block {
    margin-bottom: 18px;
}

.currency-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 4px;
}

.debt {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.debt:last-child {
    border-bottom: none;
}

.amount {
    font-weight: bold;
    white-space: nowrap;
}

.expense {
    border-bottom: 1px solid #eee;
    padding: 12px 0;
}

.expense:last-child {
    border-bottom: none;
}

.expense-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.expense-desc {
    font-weight: 600;
}

.expense-meta {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 15px;
}

/* Обнуление */

.reset-card {
    margin-top: 20px;
}

.reset-button {
    background: white;
    color: #d32f2f;
    border: 1px solid #d32f2f;
}

.reset-button:hover {
    background: #fff5f5;
}

.reset-confirm {
    display: none;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    background: #fff3f3;
    border: 1px solid #f0b5b5;
}

.reset-warning {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
    color: #8a1c1c;
}

.confirm-buttons {
    display: flex;
    gap: 8px;
}

.confirm-buttons button {
    flex: 1;
}

.confirm-delete {
    background: #d32f2f;
}

.cancel-reset {
    background: #777;
}

@media (max-width: 500px) {

    .container {
        padding: 12px;
    }

    .people {
        grid-template-columns: 1fr;
    }

    .confirm-buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>💸 Расходы поездки</h1>

    <!-- ДОБАВЛЕНИЕ РАСХОДА -->

    <div class="card">

        <label>Кто заплатил</label>

        <div class="pay-buttons">

            <label>
                <input
                    type="radio"
                    name="paidBy"
                    value="Наиль и Лена"
                >
                <span class="pay-button">
                    Наиль и Лена
                </span>
            </label>

            <label>
                <input
                    type="radio"
                    name="paidBy"
                    value="Булат и Динара"
                >
                <span class="pay-button">
                    Булат и Динара
                </span>
            </label>

            <label>
                <input
                    type="radio"
                    name="paidBy"
                    value="Эмиль"
                >
                <span class="pay-button">
                    Эмиль
                </span>
            </label>

        </div>


        <label for="amount">
            Сумма
        </label>

        <input
            id="amount"

        <label for="currency">

                $ Доллары
            </option>

        </select>


        <label for="date">

        </label>

        <input

        >


        <label for="description">
            Что купили
        </label>

        <input
            id="description"
            type="text"
            placeholder="Например, ужин"
        >


        <label>

        </label>

        <div class="people">

            <label class="person">
                <input
                    type="checkbox"
                    value="Наиль"
                    class="participant"
                >
                <span>Наиль</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Лена"
                    class="participant"
                >
                <span>Лена</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Булат"
                    class="participant"
                >
                <span>Булат</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Динара"
                    class="participant"
                >
                <span>Динара</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Эмиль"

                >
                <span>Эмиль</span>
            </label>

        </div>


        <button

        <div

    </div>


    <!-- ДОЛГИ -->

    <div class="card">

        <h2>💰 Кто кому должен</h2>

        <div
            id="debts"
            class="summary"
        >
            Загружаю...
        </div>

    </div>


    <!-- ИСТОРИЯ -->

    <div class="card">

        <h2>📋 История расходов</h2>

        <div id="expenses">
            Загружаю...
        </div>

    </div>


    <!-- ОБНУЛЕНИЕ -->

    <div class="card reset-card">

        <button
            class="reset-button"
            onclick="showResetConfirmation()"
        >
            🗑️ Обнулить расчёты
        </button>


        <div
            id="resetConfirm"
            class="reset-confirm"
        >

            <div
                id="resetWarning"
                class="reset-warning"
            >

                <strong>⚠️ Внимание!</strong>

                <br><br>

                Все сохранённые расходы будут удалены
                из общей базы.

                <br>

                Это действие нельзя отменить.

                <br><br>

                Ты действительно хочешь начать
                расчёты заново?

            </div>


            <div class="confirm-buttons">

                <button
                    class="cancel-reset"
                    onclick="cancelReset()"
                >
                    Отмена
                </button>


                <button
                    id="confirmDeleteButton"
                    class="confirm-delete"
                    onclick="resetAllExpenses()"
                >
                    Да, удалить всё
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://xhwypifggndzxlwcbpbu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ju2MdqK7EbSlOCgEbuUl_g_Y1Wl_sS0";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   НАСТРОЙКИ
========================================= */

const CURRENCY_SYMBOLS = {

    GEL: "₾",

    RUB: "₽",

    USD: "$"

};


const CURRENCY_NAMES = {

    GEL: "Лари",

    RUB: "Рубли",

    USD: "Доллары"

};


const PAIRS = [

    "Наиль и Лена",

    "Булат и Динара",

    "Эмиль"

];


/* =========================================
   ПАРЫ
========================================= */

function getPair(person) {

    if (
        person === "Наиль" ||
        person === "Лена" ||
        person === "Наиль и Лена"
    ) {

        return "Наиль и Лена";

    }


    if (
        person === "Булат" ||
        person === "Динара" ||
        person === "Булат и Динара"
    ) {

        return "Булат и Динара";

    }


    if (
        person === "Эмиль"
    ) {

        return "Эмиль";

    }


    return null;
}


/* =========================================
   ПРОВЕРКА ВАЛЮТЫ
========================================= */

function isValidCurrency(currency) {

    return Object.prototype.hasOwnProperty.call(
        CURRENCY_SYMBOLS,
        currency
    );

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================
   УЧАСТНИКИ
========================================= */

function getParticipants(expense) {

    let participants = [];


    if (
        Array.isArray(
            expense.participants
        )
    ) {

        participants =
            expense.participants;

    }


    else if (
        typeof expense.participants ===
        "string"
    ) {

        try {

            const parsed =
                JSON.parse(
                    expense.participants
                );


            if (
                Array.isArray(parsed)
            ) {

                participants =
                    parsed;

            }

        } catch (e) {

            console.warn(
                "Не удалось прочитать участников:",
                e
            );

            return [];

        }

    }


    /*
       Убираем дубли.

       Например:

       ["Наиль", "Наиль", "Эмиль"]

       превратится в:

       ["Наиль", "Эмиль"]
    */

    participants =
        [...new Set(participants)];


    /*
       Оставляем только настоящих
       участников поездки.
    */

    participants =
        participants.filter(
            person =>
                getPair(person) !== null
        );


    return participants;

}


/* =========================================
   ФОРМАТИРОВАНИЕ ДЕНЕГ
========================================= */

function roundMoney(value) {

    return Math.round(
        (Number(value) + Number.EPSILON) * 100
    ) / 100;

}


function formatMoney(
    value,
    currency
) {

    const symbol =
        CURRENCY_SYMBOLS[currency] ||
        currency;


    return (
        roundMoney(value)
    ).toFixed(2) +
    " " +
    symbol;

}


/* =========================================
   ЗАГРУЗКА
========================================= */

async function loadExpenses() {

    const {
        data,
        error
    } = await supabaseClient

        .from("expenses1")

        .select("*")

        .order(
            "date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        document.getElementById(
            "expenses"
        ).innerHTML =
            "Ошибка загрузки расходов: " +
            escapeHtml(
                error.message
            );

        return;

    }


    renderExpenses(
        data || []
    );


    calculateDebts(
        data || []
    );

}


/* =========================================
   ИСТОРИЯ
========================================= */

function renderExpenses(data) {

    const container =
        document.getElementById(
            "expenses"
        );


    if (!data.length) {

        container.innerHTML =
            '<div class="empty">Расходов пока нет</div>';

        return;

    }


    container.innerHTML =
        data.map(item => {

            const participants =
                getParticipants(
                    item
                );


            const currency =
                isValidCurrency(
                    item.currency
                )
                ? item.currency
                : "GEL";


            return `

                <div class="expense">

                    <div class="expense-top">

                        <div class="expense-desc">

                            ${escapeHtml(
                                item.description ||
                                "Расход"
                            )}

                        </div>


                        <div class="amount">

                            ${escapeHtml(
                                formatMoney(
                                    item.amount,
                                    currency
                                )
                            )}

                        </div>

                    </div>


                    <div class="expense-meta">

                        Заплатил:
                        ${escapeHtml(
                            item.paid_by ||
                            "—"
                        )}

                        <br>

                        За:
                        ${
                            participants.length
                            ?
                            participants
                                .map(escapeHtml)
                                .join(", ")
                            :
                            "—"
                        }

                        <br>

                        ${escapeHtml(
                            item.date ||
                            ""
                        )}

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================
   СОЗДАНИЕ ПУСТЫХ БАЛАНСОВ
========================================= */

function createBalances() {

    return {

        "Наиль и Лена": 0,

        "Булат и Динара": 0,

        "Эмиль": 0

    };

}


/* =========================================
   ГЛАВНЫЙ РАСЧЁТ
========================================= */

function calculateDebts(data) {

    /*
       ОЧЕНЬ ВАЖНО:

       Теперь каждая валюта считается
       отдельно.

       Нельзя складывать:

       100 GEL
       + 100 RUB
       + 100 USD

       в один баланс.
    */


    const balancesByCurrency = {

        GEL:
            createBalances(),

        RUB:
            createBalances(),

        USD:
            createBalances()

    };


    for (
        const expense of data
    ) {

        const amount =
            Number(
                expense.amount
            ) || 0;


        if (
            amount <= 0
        ) {

            continue;

        }


        const currency =
            isValidCurrency(
                expense.currency
            )
            ? expense.currency
            : "GEL";


        const participants =
            getParticipants(
                expense
            );


        if (
            participants.length === 0
        ) {

            console.warn(
                "Расход без участников:",
                expense
            );

            continue;

        }


        const payer =
            getPair(
                expense.paid_by
            );


        /*
           Если плательщик неизвестен,
           не включаем расход в расчёт,
           чтобы случайно не записать
           его на Эмиля.
        */

        if (!payer) {

            console.warn(
                "Неизвестный плательщик:",
                expense.paid_by
            );

            continue;

        }


        /*
           Доля каждого человека.
        */

        const personShare =
            amount /
            participants.length;


        /*
           Баланс соответствующей валюты.
        */

        const balances =
            balancesByCurrency[
                currency
            ];


        /*
           Плательщик получает плюс
           на всю фактически оплаченную сумму.
        */

        balances[payer] +=
            amount;


        /*
           Каждый участник получает минус
           только своей доли.
        */

        for (
            const person
            of participants
        ) {

            const pair =
                getPair(
                    person
                );


            if (!pair) {

                continue;

            }


            balances[pair] -=
                personShare;

        }

    }


    renderDebts(
        balancesByCurrency
    );

}


/* =========================================
   ПОКАЗ ДОЛГОВ
========================================= */

function renderDebts(
    balancesByCurrency
) {

    const container =
        document.getElementById(
            "debts"
        );


    let html = "";


    /*
       Показываем каждую валюту
       отдельным блоком.
    */

    for (
        const currency
        of ["GEL", "RUB", "USD"]
    ) {

        const balances =
            balancesByCurrency[
                currency
            ];


        const positive = [];

        const negative = [];


        for (
            const [
                person,
                balance
            ]
            of Object.entries(
                balances
            )
        ) {

            const roundedBalance =
                roundMoney(
                    balance
                );


            if (
                roundedBalance >= 0.01
            ) {

                positive.push({

                    person,

                    amount:
                        roundedBalance

                });

            }


            if (
                roundedBalance <= -0.01
            ) {

                negative.push({

                    person,

                    amount:
                        Math.abs(
                            roundedBalance
                        )

                });

            }

        }


        /*
           Если по этой валюте
           никто никому не должен,
           блок не показываем.
        */

        if (
            !positive.length &&
            !negative.length
        ) {

            continue;

        }


        const debts = [];


        let i = 0;

        let j = 0;


        while (
            i < negative.length &&
            j < positive.length
        ) {

            const debtor =
                negative[i];


            const creditor =
                positive[j];


            const amount =
                Math.min(
                    debtor.amount,
                    creditor.amount
                );


            const roundedAmount =
                roundMoney(
                    amount
                );


            if (
                roundedAmount >= 0.01
            ) {

                debts.push({

                    from:
                        debtor.person,

                    to:
                        creditor.person,

                    amount:
                        roundedAmount

                });

            }


            debtor.amount =
                roundMoney(
                    debtor.amount -
                    amount
                );


            creditor.amount =
                roundMoney(
                    creditor.amount -
                    amount
                );


            if (
                debtor.amount < 0.01
            ) {

                i++;

            }


            if (
                creditor.amount < 0.01
            ) {

                j++;

            }

        }


        if (!debts.length) {

            continue;

        }


        html += `

            <div class="currency-block">

                <div class="currency-title">

                    ${escapeHtml(
                        CURRENCY_NAMES[
                            currency
                        ]
                    )}

                </div>

                ${

                    debts.map(
                        debt => `

                            <div class="debt">

                                <div>

                                    ${escapeHtml(
                                        debt.from
                                    )}

                                    →

                                    ${escapeHtml(
                                        debt.to
                                    )}

                                </div>


                                <div class="amount">

                                    ${escapeHtml(
                                        formatMoney(
                                            debt.amount,
                                            currency
                                        )
                                    )}

                                </div>

                            </div>

                        `
                    ).join("")

                }

            </div>

        `;

    }


    if (!html) {

        container.innerHTML =
            '<div class="empty">Все рассчитано 👍</div>';

        return;

    }


    container.innerHTML =
        html;

}


/* =========================================
   ДОБАВИТЬ РАСХОД
========================================= */

async function addExpense() {

    const button =
        document.getElementById(
            "addButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const paidByElement =
        document.querySelector(
            'input[name="paidBy"]:checked'
        );


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const currency =
        document.getElementById(
            "currency"
        ).value;


    const date =
        document.getElementById(
            "date"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    /*
       Собираем участников.
       Set дополнительно защищает
       от дублей.
    */

    const participants =
        [
            ...new Set(
                Array.from(
                    document.querySelectorAll(
                        ".participant:checked"
                    )
                ).map(
                    checkbox =>
                        checkbox.value
                )
            )
        ];


    if (!paidByElement) {

        message.innerText =
            "Выбери, кто заплатил";

        return;

    }


    /*
       Проверяем плательщика.
    */

    if (
        !getPair(
            paidByElement.value
        )
    ) {

        message.innerText =
            "Неизвестный плательщик";

        return;

    }


    if (
        !Number.isFinite(amount) ||
        amount <= 0
    ) {

        message.innerText =
            "Укажи сумму";

        return;

    }


    if (
        !isValidCurrency(currency)
    ) {

        message.innerText =
            "Выбери корректную валюту";

        return;

    }


    if (
        participants.length === 0
    ) {

        message.innerText =
            "Выбери, за кого заплатили";

        return;

    }


    /*
       Проверяем всех участников.
    */

    const invalidParticipant =
        participants.find(
            person =>
                !getPair(person)
        );


    if (invalidParticipant) {

        message.innerText =
            "Обнаружен неизвестный участник";

        return;

    }


    button.disabled =
        true;


    message.innerText =
        "Сохраняю...";


    /*
       ВАЖНО:

       Теперь сохраняем именно то,
       что пользователь выбрал:

       "Наиль и Лена"

       или

       "Булат и Динара"

       или

       "Эмиль"

       Поэтому история будет показывать
       правильного плательщика.
    */

    const databasePayer =
        paidByElement.value;


    const row = {

        paid_by:
            databasePayer,

        amount:
            roundMoney(
                amount
            ),

        currency:
            currency,

        description:
            description ||
            "Расход",

        participants:
            participants,

        date:
            date ||
            getLocalDate()

    };


    const {
        error
    } =
        await supabaseClient

            .from(
                "expenses1"
            )

            .insert([
                row
            ]);


    if (error) {

        console.error(error);


        message.innerText =
            "Ошибка: " +
            error.message;


        button.disabled =
            false;


        return;

    }


    message.innerText =
        "Расход добавлен ✓";


    document.getElementById(
        "amount"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.querySelectorAll(
        ".participant"
    ).forEach(
        checkbox =>
            checkbox.checked =
                false
    );


    document.querySelectorAll(
        'input[name="paidBy"]'
    ).forEach(
        radio =>
            radio.checked =
                false
    );


    button.disabled =
        false;


    await loadExpenses();

}


/* =========================================
   ЛОКАЛЬНАЯ ДАТА
========================================= */

function getLocalDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================
   ОБНУЛЕНИЕ — ШАГ 1
========================================= */

function showResetConfirmation() {

    document.getElementById(
        "resetConfirm"
    ).style.display =
        "block";

}


/* =========================================
   ОТМЕНА
========================================= */

function cancelReset() {

    document.getElementById(
        "resetConfirm"
    ).style.display =
        "none";

}


/* =========================================
   ОБНУЛЕНИЕ — ШАГ 2
========================================= */

async function resetAllExpenses() {

    const warning =
        document.getElementById(
            "resetWarning"
        );


    const deleteButton =
        document.getElementById(
            "confirmDeleteButton"
        );


    deleteButton.disabled =
        true;


    warning.innerHTML =
        "<strong>Удаляю расходы...</strong>";


    /*
       Удаляем все записи.

       Сейчас оставляем тот же запрос,
       который уже работает в твоём
       проекте.
    */

    const {
        error
    } =
        await supabaseClient

            .from(
                "expenses1"
            )

            .delete()

            .gt(
                "id",
                0
            );


    if (error) {

        console.error(
            "Ошибка удаления:",
            error
        );


        warning.innerHTML = `

            <strong>
                ❌ Не удалось обнулить расчёты
            </strong>

            <br><br>

            ${escapeHtml(
                error.message
            )}

            <br><br>

            Проверь, что SQL-политика
            DELETE была добавлена
            в Supabase.

        `;


        deleteButton.disabled =
            false;


        return;

    }


    warning.innerHTML = `

        <strong>
            ✅ Расчёты обнулены
        </strong>

        <br><br>

        Все расходы удалены.

    `;


    await loadExpenses();


    setTimeout(
        () => {

            document.getElementById(
                "resetConfirm"
            ).style.display =
                "none";


            deleteButton.disabled =
                false;

        },
        1500
    );

}


/* =========================================
   ДАТА ПРИ ЗАПУСКЕ
========================================= */

document.getElementById(
    "date"
).value =
    getLocalDate();


/* =========================================
   ЗАПУСК
========================================= */

loadExpenses();

</script>
