<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Расходы поездки</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input[type="number"],
input[type="date"],
input[type="text"],
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 15px;
}

.pay-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.pay-buttons label {
    margin: 0;
    font-weight: normal;
}

.pay-buttons input {
    display: none;
}

.pay-button {
    display: block;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    background: #fafafa;
    font-size: 14px;
}

.pay-buttons input:checked + .pay-button {
    background: #222;
    color: white;
    border-color: #222;
}

.people {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
}

.person {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    background: #fafafa;
    margin: 0;
    font-weight: normal;
}

.person input {
    width: 18px;
    height: 18px;
    margin: 0;
}

button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 13px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
}

.message {
    margin-top: 10px;
    text-align: center;
    font-size: 14px;
}

.summary {
    font-size: 16px;
    line-height: 1.6;
}

.debt {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.debt:last-child {
    border-bottom: none;
}

.amount {
    font-weight: bold;
    white-space: nowrap;
}

.expense {
    border-bottom: 1px solid #eee;
    padding: 12px 0;
}

.expense:last-child {
    border-bottom: none;
}

.expense-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.expense-desc {
    font-weight: 600;
}

.expense-meta {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 15px;
}

/* Обнуление */

.reset-card {
    margin-top: 20px;
}

.reset-button {
    background: white;
    color: #d32f2f;
    border: 1px solid #d32f2f;
}

.reset-button:hover {
    background: #fff5f5;
}

.reset-confirm {
    display: none;
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    background: #fff3f3;
    border: 1px solid #f0b5b5;
}

.reset-warning {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
    color: #8a1c1c;
}

.confirm-buttons {
    display: flex;
    gap: 8px;
}

.confirm-buttons button {
    flex: 1;
}

.confirm-delete {
    background: #d32f2f;
}

.cancel-reset {
    background: #777;
}

@media (max-width: 500px) {

    .container {
        padding: 12px;
    }

    .people {
        grid-template-columns: 1fr;
    }

    .confirm-buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>💸 Расходы поездки</h1>

    <!-- ДОБАВЛЕНИЕ РАСХОДА -->

    <div class="card">

        <label>Кто заплатил</label>

        <div class="pay-buttons">

            <label>
                <input
                    type="radio"
                    name="paidBy"
                    value="Наиль и Лена"
                >
                <span class="pay-button">
                    Наиль и Лена
                </span>
            </label>

            <label>
                <input
                    type="radio"
                    name="paidBy"
                    value="Булат и Динара"
                >
                <span class="pay-button">
                    Булат и Динара
                </span>
            </label>

            <label>
                <input
                    type="radio"
                    name="paidBy"
                    value="Эмиль"
                >
                <span class="pay-button">
                    Эмиль
                </span>
            </label>

        </div>


        <label for="amount">
            Сумма
        </label>

        <input
            id="amount"
            type="number"
            step="0.01"
            min="0"
            placeholder="Например, 50"
        >


        <label for="currency">
            Валюта
        </label>

        <select id="currency">

            <option value="GEL">
                ₾ Лари
            </option>

            <option value="RUB">
                ₽ Рубли
            </option>

            <option value="USD">
                $ Доллары
            </option>

        </select>


        <label for="date">
            Дата
        </label>

        <input
            id="date"
            type="date"
        >


        <label for="description">
            Что купили
        </label>

        <input
            id="description"
            type="text"
            placeholder="Например, ужин"
        >


        <label>
            За кого
        </label>

        <div class="people">

            <label class="person">
                <input
                    type="checkbox"
                    value="Наиль"
                    class="participant"
                >
                <span>Наиль</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Лена"
                    class="participant"
                >
                <span>Лена</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Булат"
                    class="participant"
                >
                <span>Булат</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Динара"
                    class="participant"
                >
                <span>Динара</span>
            </label>

            <label class="person">
                <input
                    type="checkbox"
                    value="Эмиль"
                    class="participant"
                >
                <span>Эмиль</span>
            </label>

        </div>


        <button
            id="addButton"
            onclick="addExpense()"
        >
            Добавить расход
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- ДОЛГИ -->

    <div class="card">

        <h2>💰 Кто кому должен</h2>

        <div
            id="debts"
            class="summary"
        >
            Загружаю...
        </div>

    </div>


    <!-- ИСТОРИЯ -->

    <div class="card">

        <h2>📋 История расходов</h2>

        <div id="expenses">
            Загружаю...
        </div>

    </div>


    <!-- ОБНУЛЕНИЕ -->

    <div class="card reset-card">

        <button
            class="reset-button"
            onclick="showResetConfirmation()"
        >
            🗑️ Обнулить расчёты
        </button>


        <div
            id="resetConfirm"
            class="reset-confirm"
        >

            <div
                id="resetWarning"
                class="reset-warning"
            >

                <strong>⚠️ Внимание!</strong>

                <br><br>

                Все сохранённые расходы будут удалены
                из общей базы.

                <br>

                Это действие нельзя отменить.

                <br><br>

                Ты действительно хочешь начать
                расчёты заново?

            </div>


            <div class="confirm-buttons">

                <button
                    class="cancel-reset"
                    onclick="cancelReset()"
                >
                    Отмена
                </button>


                <button
                    id="confirmDeleteButton"
                    class="confirm-delete"
                    onclick="resetAllExpenses()"
                >
                    Да, удалить всё
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://xhwypifggndzxlwcbpbu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ju2MdqK7EbSlOCgEbuUl_g_Y1Wl_sS0";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ПАРЫ
========================================= */

function getPair(person) {

    if (
        person === "Наиль" ||
        person === "Лена"
    ) {
        return "Наиль и Лена";
    }


    if (
        person === "Булат" ||
        person === "Динара"
    ) {
        return "Булат и Динара";
    }


    return "Эмиль";
}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================
   ПОЛУЧИТЬ УЧАСТНИКОВ
========================================= */

function getParticipants(expense) {

    if (
        Array.isArray(
            expense.participants
        )
    ) {
        return expense.participants;
    }


    if (
        typeof expense.participants ===
        "string"
    ) {

        try {

            const parsed =
                JSON.parse(
                    expense.participants
                );


            if (
                Array.isArray(parsed)
            ) {
                return parsed;
            }

        } catch (e) {

            return [];

        }

    }


    return [];
}


/* =========================================
   ЗАГРУЗКА
========================================= */

async function loadExpenses() {

    const {
        data,
        error
    } = await supabaseClient

        .from("expenses1")

        .select("*")

        .order(
            "date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        document.getElementById(
            "expenses"
        ).innerHTML =
            "Ошибка загрузки расходов: " +
            escapeHtml(
                error.message
            );

        return;
    }


    renderExpenses(
        data || []
    );


    calculateDebts(
        data || []
    );
}


/* =========================================
   ИСТОРИЯ
========================================= */

function renderExpenses(data) {

    const container =
        document.getElementById(
            "expenses"
        );


    if (!data.length) {

        container.innerHTML =
            '<div class="empty">Расходов пока нет</div>';

        return;
    }


    container.innerHTML =
        data.map(item => {

            const participants =
                getParticipants(
                    item
                );


            return `

                <div class="expense">

                    <div class="expense-top">

                        <div class="expense-desc">

                            ${escapeHtml(
                                item.description ||
                                "Расход"
                            )}

                        </div>


                        <div class="amount">

                            ${escapeHtml(
                                item.amount
                            )}

                            ${escapeHtml(
                                item.currency ||
                                "GEL"
                            )}

                        </div>

                    </div>


                    <div class="expense-meta">

                        Заплатил:
                        ${escapeHtml(
                            item.paid_by ||
                            "—"
                        )}

                        <br>

                        За:
                        ${
                            participants.length
                            ?
                            participants
                                .map(escapeHtml)
                                .join(", ")
                            :
                            "—"
                        }

                        <br>

                        ${escapeHtml(
                            item.date ||
                            ""
                        )}

                    </div>

                </div>

            `;

        }).join("");
}


/* =========================================
   ГЛАВНЫЙ РАСЧЁТ
========================================= */

function calculateDebts(data) {

    /*
       ВАЖНО:

       Здесь мы сначала считаем долю
       КАЖДОГО человека.

       Например:

       100 / 5 = 20

       А уже после этого объединяем
       Наиля + Лену и Булата + Динару.
    */


    const balances = {

        "Наиль и Лена": 0,

        "Булат и Динара": 0,

        "Эмиль": 0

    };


    for (
        const expense of data
    ) {

        const amount =
            Number(
                expense.amount
            ) || 0;


        if (
            amount <= 0
        ) {
            continue;
        }


        const participants =
            getParticipants(
                expense
            );


        if (
            participants.length === 0
        ) {
            continue;
        }


        /*
           Сколько должен каждый
           конкретный человек.
        */

        const personShare =
            amount /
            participants.length;


        /*
           Кто заплатил.
        */

        const payer =
            getPair(
                expense.paid_by
            );


        /*
           Плательщик получает плюс
           на всю фактически оплаченную сумму.
        */

        balances[payer] += amount;


        /*
           Каждый участник получает минус
           только свою личную долю.
        */

        for (
            const person
            of participants
        ) {

            const pair =
                getPair(
                    person
                );


            balances[pair] -=
                personShare;

        }

    }


    renderDebts(
        balances
    );
}


/* =========================================
   ПОКАЗ ДОЛГОВ
========================================= */

function renderDebts(balances) {

    const container =
        document.getElementById(
            "debts"
        );


    const positive = [];

    const negative = [];


    for (
        const [
            person,
            balance
        ]
        of Object.entries(
            balances
        )
    ) {

        if (
            balance > 0.01
        ) {

            positive.push({

                person,

                amount:
                    balance

            });

        }


        if (
            balance < -0.01
        ) {

            negative.push({

                person,

                amount:
                    Math.abs(
                        balance
                    )

            });

        }

    }


    if (
        !positive.length &&
        !negative.length
    ) {

        container.innerHTML =
            '<div class="empty">Все рассчитано 👍</div>';

        return;
    }


    const debts = [];


    let i = 0;

    let j = 0;


    while (
        i < negative.length &&
        j < positive.length
    ) {

        const debtor =
            negative[i];


        const creditor =
            positive[j];


        const amount =
            Math.min(
                debtor.amount,
                creditor.amount
            );


        debts.push({

            from:
                debtor.person,

            to:
                creditor.person,

            amount:
                amount

        });


        debtor.amount -=
            amount;


        creditor.amount -=
            amount;


        if (
            debtor.amount < 0.01
        ) {

            i++;

        }


        if (
            creditor.amount < 0.01
        ) {

            j++;

        }

    }


    if (!debts.length) {

        container.innerHTML =
            '<div class="empty">Все рассчитано 👍</div>';

        return;
    }


    container.innerHTML =
        debts.map(debt => `

            <div class="debt">

                <div>

                    ${escapeHtml(
                        debt.from
                    )}

                    →

                    ${escapeHtml(
                        debt.to
                    )}

                </div>


                <div class="amount">

                    ${debt.amount.toFixed(2)}
                    ₾

                </div>

            </div>

        `).join("");
}


/* =========================================
   ДОБАВИТЬ РАСХОД
========================================= */

async function addExpense() {

    const button =
        document.getElementById(
            "addButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    const paidByElement =
        document.querySelector(
            'input[name="paidBy"]:checked'
        );


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const currency =
        document.getElementById(
            "currency"
        ).value;


    const date =
        document.getElementById(
            "date"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const participants =
        Array.from(
            document.querySelectorAll(
                ".participant:checked"
            )
        ).map(
            checkbox =>
                checkbox.value
        );


    if (!paidByElement) {

        message.innerText =
            "Выбери, кто заплатил";

        return;
    }


    if (
        !amount ||
        amount <= 0
    ) {

        message.innerText =
            "Укажи сумму";

        return;
    }


    if (
        participants.length === 0
    ) {

        message.innerText =
            "Выбери, за кого заплатили";

        return;
    }


    button.disabled =
        true;


    message.innerText =
        "Сохраняю...";


    let databasePayer =
        paidByElement.value;


    /*
       Для пары сохраняем одного
       представителя.

       getPair() потом всё равно
       определит правильную пару.
    */

    if (
        databasePayer ===
        "Наиль и Лена"
    ) {

        databasePayer =
            "Наиль";

    }


    if (
        databasePayer ===
        "Булат и Динара"
    ) {

        databasePayer =
            "Булат";

    }


    const row = {

        paid_by:
            databasePayer,

        amount:
            amount,

        currency:
            currency,

        description:
            description ||
            "Расход",

        participants:
            participants,

        date:
            date ||
            new Date()
                .toISOString()
                .slice(
                    0,
                    10
                )

    };


    const {
        error
    } =
        await supabaseClient

            .from(
                "expenses1"
            )

            .insert([
                row
            ]);


    if (error) {

        console.error(error);


        message.innerText =
            "Ошибка: " +
            error.message;


        button.disabled =
            false;


        return;
    }


    message.innerText =
        "Расход добавлен ✓";


    document.getElementById(
        "amount"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    document.querySelectorAll(
        ".participant"
    ).forEach(
        checkbox =>
            checkbox.checked =
                false
    );


    document.querySelectorAll(
        'input[name="paidBy"]'
    ).forEach(
        radio =>
            radio.checked =
                false
    );


    button.disabled =
        false;


    await loadExpenses();
}


/* =========================================
   ОБНУЛЕНИЕ — ШАГ 1
========================================= */

function showResetConfirmation() {

    document.getElementById(
        "resetConfirm"
    ).style.display =
        "block";
}


/* =========================================
   ОТМЕНА
========================================= */

function cancelReset() {

    document.getElementById(
        "resetConfirm"
    ).style.display =
        "none";
}


/* =========================================
   ОБНУЛЕНИЕ — ШАГ 2
========================================= */

async function resetAllExpenses() {

    const warning =
        document.getElementById(
            "resetWarning"
        );


    const deleteButton =
        document.getElementById(
            "confirmDeleteButton"
        );


    deleteButton.disabled =
        true;


    warning.innerHTML =
        "<strong>Удаляю расходы...</strong>";


    /*
       Удаляем ВСЕ записи.

       Условие id > 0 означает:
       удалить все строки с положительным id.
    */

    const {
        error
    } =
        await supabaseClient

            .from(
                "expenses1"
            )

            .delete()

            .gt(
                "id",
                0
            );


    if (error) {

        console.error(
            "Ошибка удаления:",
            error
        );


        warning.innerHTML = `

            <strong>
                ❌ Не удалось обнулить расчёты
            </strong>

            <br><br>

            ${escapeHtml(
                error.message
            )}

            <br><br>

            Проверь, что SQL-политика
            DELETE была добавлена
            в Supabase.

        `;


        deleteButton.disabled =
            false;


        return;
    }


    /*
       Успешное удаление.
    */

    warning.innerHTML = `

        <strong>
            ✅ Расчёты обнулены
        </strong>

        <br><br>

        Все расходы удалены.

    `;


    /*
       Обновляем историю
       и расчёты.
    */

    await loadExpenses();


    /*
       Через 1.5 секунды
       закрываем окно.
    */

    setTimeout(
        () => {

            document.getElementById(
                "resetConfirm"
            ).style.display =
                "none";


            deleteButton.disabled =
                false;

        },
        1500
    );
}


/* =========================================
   ДАТА
========================================= */

document.getElementById(
    "date"
).value =
    new Date()
        .toISOString()
        .slice(
            0,
            10
        );


/* =========================================
   ЗАПУСК
========================================= */

loadExpenses();

</script>

</body>
</html>
