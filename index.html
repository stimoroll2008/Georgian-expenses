<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расходы в Грузии</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      background: #222;
      color: white;
      cursor: pointer;
      border: none;
      margin-top: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 9px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
    }

    .error {
      color: #c00;
    }

    .success {
      color: green;
    }

    .table-wrap {
      overflow-x: auto;
    }
  </style>
</head>

<body>

<h1>🇬🇪 Расходы в Грузии</h1>

<div class="card">

  <h2>Добавить расход</h2>

  <input id="paid_by" placeholder="Кто заплатил">

  <input id="amount" type="number" step="0.01" placeholder="Сумма">

  <input id="currency" value="GEL" placeholder="Валюта">

  <input id="description" placeholder="За что заплатили">

  <input id="participants" placeholder="Участники">

  <input id="category" placeholder="Категория">

  <input id="pair" placeholder="Пара">

  <input id="date" type="date">

  <button onclick="addExpense()">Добавить расход</button>

  <div id="message" class="message"></div>

</div>


<div class="card">

  <h2>Все расходы</h2>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>Кто</th>
          <th>Сумма</th>
          <th>За что</th>
          <th>Участники</th>
          <th>Дата</th>
        </tr>
      </thead>

      <tbody id="expenses">
        <tr>
          <td colspan="5">Загрузка...</td>
        </tr>
      </tbody>

    </table>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://xhwypifggndzxlwcbpbu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ju2MdqK7EbSlOCgEbuUl_g_Y1Wl_sS0";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadExpenses() {

  const table = document.getElementById("expenses");

  const { data, error } = await db
    .from("expenses1")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    table.innerHTML =
      `<tr>
        <td colspan="5" class="error">
          Ошибка базы: ${error.message}
        </td>
      </tr>`;

    return;
  }

  if (!data || data.length === 0) {

    table.innerHTML =
      `<tr>
        <td colspan="5">Пока расходов нет</td>
      </tr>`;

    return;
  }

  table.innerHTML = data.map(row => `
    <tr>
      <td>${safe(row.paid_by)}</td>
      <td>${row.amount} ${safe(row.currency)}</td>
      <td>${safe(row.description)}</td>
      <td>${safe(row.participants)}</td>
      <td>${safe(row.date)}</td>
    </tr>
  `).join("");
}


async function addExpense() {

  const message = document.getElementById("message");

  const paid_by =
    document.getElementById("paid_by").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  const currency =
    document.getElementById("currency").value.trim() || "GEL";

  const description =
    document.getElementById("description").value.trim();

  const participants =
    document.getElementById("participants").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const pair =
    document.getElementById("pair").value.trim();

  const date =
    document.getElementById("date").value || null;


  if (!paid_by || !amount || !description) {

    message.className = "message error";
    message.textContent =
      "Заполни: кто заплатил, сумму и за что.";

    return;
  }


  message.className = "message";
  message.textContent = "Сохраняем...";


  const { error } = await db
    .from("expenses1")
    .insert({
      paid_by: paid_by,
      amount: amount,
      currency: currency,
      description: description,
      participants: participants,
      category: category,
      pair: pair,
      date: date
    });


  if (error) {

    console.error(error);

    message.className = "message error";
    message.textContent =
      "Ошибка: " + error.message;

    return;
  }


  message.className = "message success";
  message.textContent = "Расход добавлен!";


  document.getElementById("paid_by").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("description").value = "";
  document.getElementById("participants").value = "";
  document.getElementById("category").value = "";
  document.getElementById("pair").value = "";


  await loadExpenses();
}


function safe(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


loadExpenses();

</script>

</body>
</html>
